# =============================================================================
# Publica el juego en GitHub Pages, sin intervención manual.
#
# No hay paso de compilación: el repositorio ES el sitio. Se empaqueta tal cual,
# dejando fuera lo que no pinta nada en un navegador (migraciones, herramientas,
# documentación).
#
# El flujo activa Pages por sí mismo la primera vez (`enablement: true`), así
# que no hay que tocar Settings → Pages a mano. Lo único que hace falta es que
# este fichero esté en la rama por defecto: GitHub sólo reconoce los flujos que
# viven ahí.
# =============================================================================
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
    # Un cambio que no toca el sitio no merece un despliegue.
    paths:
      - 'index.html'
      - '.nojekyll'
      - 'src/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write      # publicar, y activar Pages la primera vez
  id-token: write   # deploy-pages se autentica con OIDC

# Si entran dos commits seguidos, sólo se publica el último. Pero no se cancela
# un despliegue a medias: dejaría Pages en un estado a medio escribir.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1 · Comprobar antes de publicar
  # ---------------------------------------------------------------------------
  # Barato y rápido: sólo lo que puede romper el sitio publicado. Las pruebas de
  # base de datos viven en check.yml, porque guardan el servidor, no el sitio.
  verify:
    name: Comprobar el cliente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sintaxis de los módulos
        run: |
          fallos=0
          for f in $(find src/js -name '*.js'); do
            node --check "$f" || { echo "::error file=$f::error de sintaxis"; fallos=1; }
          done
          exit $fallos

      - name: El catálogo es JSON válido y no está vacío
        run: |
          node -e '
            const c = require("./src/data/catalog.json");
            const faltan = ["resources", "buildingTypes", "recipes"]
              .filter((k) => !Array.isArray(c[k]) || c[k].length === 0);
            if (faltan.length) {
              console.log("::error::catalog.json no trae: " + faltan.join(", "));
              process.exit(1);
            }
            console.log(`catálogo: ${c.resources.length} recursos, ` +
                        `${c.buildingTypes.length} edificios, ${c.recipes.length} recetas`);
          '

      - name: Todo lo que index.html referencia existe
        run: |
          fallos=0
          # Sólo rutas locales: se descartan las que llevan esquema (data:, https:).
          for ref in $(grep -oE '(href|src)="[^"]+"' index.html \
                       | sed -E 's/.*="([^"]+)"/\1/' \
                       | grep -vE '^[a-z]+:' ); do
            ruta="${ref#./}"
            if [ ! -f "$ruta" ]; then
              echo "::error file=index.html::index.html referencia $ref y no existe"
              fallos=1
            fi
          done
          exit $fallos

      - name: Ninguna ruta absoluta (rompería bajo /UrbanHills/)
        run: |
          # Pages sirve un repo de proyecto en un subdirectorio, así que una ruta
          # que empiece por "/" apunta fuera del sitio y da 404.
          if grep -rnE '(src|href)="/[^/]' index.html src/ 2>/dev/null; then
            echo "::error::hay rutas absolutas; usa rutas relativas (./src/...)"
            exit 1
          fi
          echo 'sin rutas absolutas'

      - name: Avisar si Supabase no está configurado
        run: |
          # No es un error: un fork sin backend arranca en modo demo a propósito.
          # Pero publicar sin querer en modo demo desconcierta, así que se avisa.
          if grep -qE "^export const SUPABASE_URL\s+= '';" src/js/config.js; then
            echo "::warning file=src/js/config.js::sin credenciales de Supabase: el sitio se publicará en MODO DEMO"
          else
            echo 'Supabase configurado'
          fi

  # ---------------------------------------------------------------------------
  # 2 · Empaquetar el sitio
  # ---------------------------------------------------------------------------
  build:
    name: Empaquetar
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar _site
        run: |
          mkdir -p _site
          cp -r index.html .nojekyll src _site/
          # Pages sirve 404.html cuando la ruta no existe. Como el router va por
          # hash, cualquier ruta desconocida debe devolver el propio juego.
          cp index.html _site/404.html

      - name: Servirlo bajo subdirectorio y comprobar que carga
        run: |
          # Se reproduce cómo lo sirve Pages —en /UrbanHills/, no en la raíz—
          # porque es justo ahí donde se notan las rutas mal puestas.
          mkdir -p /tmp/pages/${GITHUB_REPOSITORY#*/}
          cp -r _site/. /tmp/pages/${GITHUB_REPOSITORY#*/}/
          python3 -m http.server 8099 --bind 127.0.0.1 --directory /tmp/pages &
          servidor=$!
          # El servidor tarda un instante en aceptar conexiones.
          for i in $(seq 1 20); do
            curl -sf -o /dev/null "http://127.0.0.1:8099/${GITHUB_REPOSITORY#*/}/" && break
            sleep 0.5
          done

          base="http://127.0.0.1:8099/${GITHUB_REPOSITORY#*/}"
          fallos=0
          for ruta in / 404.html src/js/main.js src/js/config.js \
                      src/css/app.css src/data/catalog.json; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "$base/$ruta")
            echo "  $codigo  $ruta"
            [ "$codigo" = "200" ] || fallos=1
          done

          kill $servidor
          if [ $fallos -ne 0 ]; then
            echo "::error::el sitio empaquetado no sirve todos sus ficheros bajo subdirectorio"
            exit 1
          fi

      # Pages en un repositorio privado necesita plan de pago (Pro, Team o
      # Enterprise). Con plan de pago funciona igual que en uno público, así que
      # aquí NO se bloquea por ser privado: se informa y se deja que el paso
      # siguiente lo intente. Si falla, el diagnóstico de después explica por qué.
      - name: Contexto de publicación
        id: contexto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api() {
            curl -s -H "Authorization: Bearer $GH_TOKEN" \
                 -H 'Accept: application/vnd.github+json' "$@"
          }

          # Se pregunta a la API en vez de leer github.event.repository, que no
          # está en el payload de todos los disparadores (workflow_dispatch).
          privado=$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
                    | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("private", False)).lower())')
          estado=$(api -o /dev/null -w '%{http_code}' \
                   "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")

          echo "repositorio privado: $privado · API de Pages: HTTP $estado"
          echo "privado=$privado" >> "$GITHUB_OUTPUT"

          if [ "$estado" = '200' ]; then
            echo 'Pages ya está activo.'
          elif [ "$privado" = 'true' ]; then
            echo '::notice::Pages no está activo aún. Al ser un repositorio privado, activarlo requiere plan de pago (Pro, Team o Enterprise).'
          else
            echo 'Pages no está activo; el paso siguiente lo activará.'
          fi

      - name: Activar Pages si hace falta
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          # Activa Pages por API si aún no lo está, en vez de exigir que alguien
          # entre en Settings. Necesita el permiso `pages: write` de arriba.
          enablement: true

      # Si activar Pages falló, el error de la API no dice nada útil. Aquí se
      # traduce a qué hacer, y sólo entonces se corta el flujo.
      - name: Por qué no se pudo activar Pages
        if: steps.pages.outcome == 'failure'
        run: |
          {
            echo '## ⛔ No se pudo activar GitHub Pages'
            echo
            if [ '${{ steps.contexto.outputs.privado }}' = 'true' ]; then
              echo 'El repositorio es **privado**. Pages en repos privados requiere'
              echo 'un plan de pago (Pro, Team o Enterprise); en el plan gratuito'
              echo 'sólo se publica desde repositorios públicos.'
              echo
              echo 'Tres salidas:'
              echo
              echo '1. **Pasar a GitHub Pro** (~4 $/mes) y dejarlo privado. En cuanto'
              echo '   esté contratado, basta con volver a lanzar este flujo.'
              echo '2. **Hacer el repositorio público** — gratis. La `anon key` de'
              echo '   Supabase puede estar a la vista: es pública por diseño y está'
              echo '   protegida por RLS. La `service_role key` no está en el repo.'
              echo '3. **Publicar en otro sitio** (Cloudflare Pages, Netlify), que sí'
              echo '   admiten repositorios privados en su plan gratuito.'
            else
              echo 'El repositorio es público, así que no es un asunto de plan.'
              echo 'Revisa que Actions tenga permiso de escritura sobre Pages en'
              echo '*Settings → Actions → General → Workflow permissions*.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo '::error::no se pudo activar GitHub Pages; el resumen del run explica las opciones'
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ---------------------------------------------------------------------------
  # 3 · Publicar
  # ---------------------------------------------------------------------------
  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Comprobar que el sitio responde
        run: |
          url='${{ steps.deployment.outputs.page_url }}'
          # Pages tarda unos segundos en propagar el despliegue por su CDN.
          for i in $(seq 1 12); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' -L "$url")
            [ "$codigo" = "200" ] && break
            sleep 10
          done
          echo "$url -> $codigo"
          [ "$codigo" = "200" ] || {
            echo "::warning::el sitio aún no responde 200; puede tardar en propagarse"
          }

      - name: Resumen
        run: |
          {
            echo '## 🏙️ UrbanHills publicado'
            echo
            echo "**${{ steps.deployment.outputs.page_url }}**"
            echo
            echo "Commit \`${GITHUB_SHA::7}\` · $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
