# =============================================================================
# Publica el juego en GitHub Pages.
#
# No hay paso de compilación: el repositorio ES el sitio. Se sube tal cual,
# excluyendo lo que no pinta nada en un navegador (migraciones, herramientas).
# =============================================================================
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos commits seguidos, sólo se publica el último; pero no se
# cancela un despliegue a medias, que dejaría Pages en un estado raro.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar el sitio
        run: |
          mkdir -p _site
          cp -r index.html .nojekyll src _site/
          # Pages sirve 404.html cuando la ruta no existe. Como el router va por
          # hash, cualquier ruta desconocida debe devolver el propio juego.
          cp index.html _site/404.html

      - name: Comprobar que el catálogo está exportado
        run: test -s _site/src/data/catalog.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
